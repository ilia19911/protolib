name: C/C++ CI

on:
  push:
    branches: [ "feat/debug" ]
  pull_request:
    branches: [ "feat/debug" ]

jobs:
  build:

    runs-on: ubuntu22

    steps:
    - uses: actions/checkout@v4
    - name: configure
      run: ./configure
    - name: make
      run: make
    - name: make check
      run: make check
    - name: make distcheck
      run: make distcheck
